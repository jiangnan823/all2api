name: ci

# all2api — M0 CI gate
# Owner: devops. Placed at repo root: .github/workflows/ci.yml
#
# If backend changes any of the conventions below, edit ONLY the env block at top;
# every job reads from it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Version coupling (all three legs measured on the same tree, e0c6bce):
  #   * the analysers must be BUILT with a Go >= the Go that compiles this module, or
  #     their package loader cannot read the export data. At go1.27.2 gosec v2.29.0
  #     printed `Issues : 0` after 63 failed loads — a SILENT FALSE GREEN, worse than a
  #     red (its decoder caps at export data v4, and v2.29.0 is already the newest
  #     release, so this is fixed by lowering OUR Go pin, not by raising gosec's).
  #   * at go1.24 the v1 lint line is dead (v1.64.8 exits 7: "file requires newer Go
  #     version go1.26") and govulncheck cannot even install (x/vuln needs go >= 1.26).
  #   * osv reaches zero only at the stdlib fixes: go1.25.13 / go1.26.9.
  # 1.26.9 is the only point that satisfies all three at once. Raising this value means
  # raising the three tool pins below in the SAME commit and re-running every gate
  # locally under the new pairing — never one at a time.
  GO_VERSION: "1.26.9"
  # `local` means the toolchain that builds and analyses this repo is exactly
  # GO_VERSION. `auto` (the Go default) would silently fetch a different Go whenever a
  # tool's own go.mod asked for a newer one, so the scan would report on a version we
  # never declared — that is precisely how the run @e0c6bce osv result became
  # unreproducible. If a pinned tool ever needs a newer Go, raise GO_VERSION instead of
  # relaxing this.
  GOTOOLCHAIN: "local"
  GOLANGCI_VERSION: "v2.14.0"
  GOSEC_VERSION: "v2.29.0"
  GOVULNCHECK_VERSION: "v1.9.0"
  NODE_VERSION: "22"
  BINARY: all2api
  ENTRYPOINT: ./cmd/gateway
  PANEL_DIR: web-panel
  EMBED_DIR: internal/web/dist
  HEALTH_PATH: /healthz
  LISTEN_PORT: "7863"

jobs:
  # All jobs pin `ubuntu-24.04` instead of `ubuntu-latest`: latest migrates to Ubuntu 26
  # on 2026-10-19, and a runner OS change landing in the same window as the Go pin bump
  # would make any red impossible to attribute. Pinned label = one variable at a time.
  # ---------------------------------------------------------------- panel -----
  panel:
    name: panel / build
    runs-on: ubuntu-24.04
    # No job-level `if` here, on purpose. GitHub evaluates jobs.<job_id>.if with only
    # the github/needs/vars/inputs contexts and only the always/cancelled/success/
    # failure functions — `env` AND `hashFiles()` are both rejected there, and a
    # rejected expression fails the whole workflow before any job is created (the
    # "0 jobs, instant failure" signature seen in runs 38413356374/38413358569 and
    # 38428692560/38428694889). Panel presence is therefore detected in a step and
    # each npm step is gated on that output.
    outputs:
      dist: ${{ steps.probe.outputs.built }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect panel project
        id: detect
        run: |
          if [ -f "${PANEL_DIR}/package-lock.json" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${PANEL_DIR} has no locked Node project yet — panel steps are a no-op (M1 item, fronted)"
          fi

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.PANEL_DIR }}/package-lock.json

      - name: Install
        if: steps.detect.outputs.present == 'true'
        working-directory: ${{ env.PANEL_DIR }}
        run: npm ci

      # Panel supply-chain self-report (B1 seam, devops 口径).
      # CI installs with `npm ci` and deliberately does NOT add `--ignore-scripts`:
      # esbuild's platform package needs its postinstall to drop the native binary, so
      # suppressing lifecycle scripts would produce a panel job that is green and broken.
      # Reproducibility instead rests on the lockfile (the npm cache key is this same
      # package-lock.json), on `npm ci` refusing any lock drift, and on the evidence printed
      # here. fronted reported a local `esbuild@0.28.2 postinstall 未被 allowScripts 覆盖`
      # warning with exit 0 — if this repo ever adopts an allow-scripts policy it must
      # whitelist esbuild's postinstall, and that decision belongs in this line, not silently
      # inside a build step.
      - name: Panel toolchain & supply-chain self-report
        if: steps.detect.outputs.present == 'true'
        working-directory: ${{ env.PANEL_DIR }}
        run: |
          set -e
          node -v
          npm -v
          npm ls vite esbuild --depth=1 || true
          echo "ignore-scripts=$(npm config get ignore-scripts)"

      # typecheck/test are hard gates whenever the scripts exist.
      - name: Typecheck + unit tests (if defined)
        if: steps.detect.outputs.present == 'true'
        working-directory: ${{ env.PANEL_DIR }}
        run: |
          set -e
          npm run --if-present typecheck
          npm run --if-present test

      # B1 (M2) makes bundling real. Landing path is the repo's documented convention, re-ruled
      # by PM on 2026-10-14 (seq=870): **the panel bundle lands in `web-panel/dist`** and the
      # mover (this pipeline, and the Dockerfile's `web` stage) is what feeds `internal/web/dist`.
      # fronted's vite config therefore keeps `outDir: 'dist'` with `emptyOutDir: false`
      # (`.gitignore:37` reserves a `web-panel/dist/.gitkeep` negation, and clearing the embed
      # dir would break `//go:embed all:dist`, which cannot compile against an empty directory).
      #
      # The one thing this job must never do is print green without proving the bundle exists:
      # the old step did `find dist` but then gated the non-empty assertion AND the artifact
      # upload on that same step's output, so a wrong landing path skipped both `if`s and the
      # job stayed green while nothing was embedded. Probing and asserting are separate steps now,
      # and "a build script was declared but no files landed" is a red.
      - name: Build panel (no-op while package.json declares no build script)
        if: steps.detect.outputs.present == 'true'
        working-directory: ${{ env.PANEL_DIR }}
        run: |
          set -e
          npm run --if-present build

      - name: Probe panel bundle
        id: probe
        if: steps.detect.outputs.present == 'true'
        run: |
          set -e
          declared=$(node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync(process.env.PANEL_DIR+"/package.json","utf8"));console.log(p.scripts&&p.scripts.build?"true":"false")')
          real=$(find "${PANEL_DIR}/dist" -type f ! -name '.gitkeep' 2>/dev/null | wc -l)
          echo "build script declared: ${declared}"
          echo "real bundle files in ${PANEL_DIR}/dist (excluding .gitkeep): ${real}"
          find "${PANEL_DIR}/dist" -type f ! -name '.gitkeep' 2>/dev/null | sort | head -20 || true
          echo "declared=${declared}" >> "$GITHUB_OUTPUT"
          built=false
          if [ "${declared}" = "true" ] && [ "${real}" -gt 0 ]; then built=true; fi
          echo "built=${built}" >> "$GITHUB_OUTPUT"
          echo "panel bundle present: ${built}"
          if [ "${declared}" = "false" ]; then
            echo "::notice::${PANEL_DIR} declares no build script — bundling is a no-op and the embed stays on its placeholder (fronted owns B1)"
          fi

      - name: Assert the panel bundle is real
        if: steps.detect.outputs.present == 'true'
        run: |
          set -e
          if [ "${{ steps.probe.outputs.declared }}" = "true" ] && [ "${{ steps.probe.outputs.built }}" != "true" ]; then
            echo "::error::${PANEL_DIR} declares a build script but ${PANEL_DIR}/dist holds no real files — the mover would embed a placeholder page"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: steps.probe.outputs.built == 'true'
        with:
          name: panel-dist
          path: ${{ env.PANEL_DIR }}/dist
          retention-days: 7

  # ---------------------------------------------------------------- lint ------
  lint:
    name: lint / vet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # The repo has no go.sum yet (the module declares zero requires), and setup-go's
          # default dependency pattern is **/go.sum — with no such file the module-cache key
          # silently misses on every run ("Restore cache failed: Dependencies file is not
          # found", measured on run 38499871123). go.mod is the honest lock input today.
          # When M2 adds a dependency this must move to go.sum in the same commit, together
          # with `go mod verify` and `-mod=readonly`.
          cache-dependency-path: go.mod

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          set -e
          bad=$(gofmt -l $(find . -name '*.go' -not -path './vendor/*') 2>/dev/null)
          if [ -n "$bad" ]; then
            echo "$bad"
            echo "::error::run 'gofmt -w' on the files above"
            exit 1
          fi

      # Skew triage: a green lint job only means something if the loader actually read
      # the packages. Print the two versions that decide that (the toolchain that built
      # the analyser vs the toolchain compiling this module) before the verdict line.
      - name: Toolchain self-report
        run: |
          set -e
          go version
          echo "GOTOOLCHAIN=$(go env GOTOOLCHAIN)  pinned GO_VERSION=${{ env.GO_VERSION }}"

      # Installed from source, pinned, at the SAME Go as the module: the golangci release
      # action hands us a prebuilt binary whose own toolchain we cannot observe, and a
      # loader older than the compiled module silently degrades into bogus typechecking
      # errors (measured at go1.27). Pin lives in the env block, raised together with
      # GO_VERSION only.
      - name: Install golangci-lint (source build, pinned)
        run: |
          set -e
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_VERSION }}
          BIN="$(go env GOPATH)/bin/golangci-lint"
          "$BIN" --version
          # Assert the pin instead of trusting it: `go install pkg@version` stamps the module
          # into the binary, and `go version -m` is the only line that proves which version
          # actually ran (golangci prints it, gosec does not — see the security job).
          got=$(go version -m "$BIN" | awk '$1=="mod"{print $3}')
          echo "embedded module version: ${got:-none}"
          if [ "${got}" != "${{ env.GOLANGCI_VERSION }}" ]; then
            echo "::error::golangci-lint on PATH is ${got:-unknown}, expected ${{ env.GOLANGCI_VERSION }}"
            exit 1
          fi

      - name: golangci-lint
        run: |
          set -e
          # v2 has no default lint timeout; CI bounds it explicitly (v1 kept this in config).
          "$(go env GOPATH)/bin/golangci-lint" run --timeout 5m ./...

  # ---------------------------------------------------------------- test ------
  test:
    name: test / race
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # go:embed fails on a missing/empty dir. When the panel job is skipped
      # (M0 skeleton state) we materialise the placeholder committed at
      # internal/web/dist/.gitkeep so unit tests can still compile.
      - name: Ensure embed dir exists
        run: mkdir -p ${{ env.EMBED_DIR }} && touch ${{ env.EMBED_DIR }}/.gitkeep

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # The repo has no go.sum yet (the module declares zero requires), and setup-go's
          # default dependency pattern is **/go.sum — with no such file the module-cache key
          # silently misses on every run ("Restore cache failed: Dependencies file is not
          # found", measured on run 38499871123). go.mod is the honest lock input today.
          # When M2 adds a dependency this must move to go.sum in the same commit, together
          # with `go mod verify` and `-mod=readonly`.
          cache-dependency-path: go.mod

      - name: Unit tests with race detector
        run: go test -race -count=1 -timeout 300s ./...

      - name: Coverage summary
        if: always()
        run: |
          go test -count=1 -coverprofile=coverage.out -covermode=atomic ./... 2>/dev/null || true
          if [ -s coverage.out ]; then
            total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')
            echo "total coverage: ${total:-n/a}"
            echo "total_coverage=${total:-n/a}" >> "$GITHUB_ENV"
          fi

  # ---------------------------------------------------------------- build -----
  build:
    name: build / ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-24.04
    # `panel` joins the dependency list so bundling is ordered BEFORE every go build, which
    # is the seam fronted asked for: the shipped CI binaries must contain the real panel, not
    # the .gitkeep placeholder. Attribution is preserved — a panel failure is still red in the
    # panel job, and this job keeps a .gitkeep fallback for when no bundle exists (pre-B1), so
    # a frontend gap can never masquerade as a Go build red.
    needs: [lint, test, panel]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            suffix: ""
          - os: linux
            arch: arm64
            suffix: ""
          - os: windows
            arch: amd64
            suffix: ".exe"
          - os: darwin
            arch: arm64
            suffix: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # The repo has no go.sum yet (the module declares zero requires), and setup-go's
          # default dependency pattern is **/go.sum — with no such file the module-cache key
          # silently misses on every run ("Restore cache failed: Dependencies file is not
          # found", measured on run 38499871123). go.mod is the honest lock input today.
          # When M2 adds a dependency this must move to go.sum in the same commit, together
          # with `go mod verify` and `-mod=readonly`.
          cache-dependency-path: go.mod

      # The Go gate stays compilable without a panel: `//go:embed all:dist` needs a non-empty
      # directory, and the tracked .gitkeep provides that. When the panel job did produce a
      # bundle, THIS job is the mover: `web-panel/dist` (uploaded by the panel job) is restored
      # straight into the embed directory, same shape as release.yml's "Restore panel dist", so
      # the artefacts uploaded here are the binaries users actually get.
      - name: Ensure embed dir is buildable
        run: mkdir -p ${{ env.EMBED_DIR }} && touch ${{ env.EMBED_DIR }}/.gitkeep

      - name: Restore panel dist into the embed dir
        if: needs.panel.outputs.dist == 'true'
        uses: actions/download-artifact@v4
        with:
          name: panel-dist
          path: ${{ env.EMBED_DIR }}

      # "Green upload, empty download" is a real failure mode (artifact name typos, gated
      # uploads), and it would land silently: go:embed happily compiles a directory that only
      # contains .gitkeep. So the move is asserted at the destination, not assumed.
      - name: Assert the bundle landed in the embed dir
        if: needs.panel.outputs.dist == 'true'
        run: |
          set -e
          n=$(find "${EMBED_DIR}" -type f ! -name .gitkeep | wc -l)
          echo "real files in ${EMBED_DIR} after restore: ${n}"
          find "${EMBED_DIR}" -type f ! -name .gitkeep | sort | head -20
          if [ "${n}" -eq 0 ]; then
            echo "::error::panel job reported a bundle but ${EMBED_DIR} received nothing — binaries would embed the placeholder"
            exit 1
          fi

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME:-dev}"
          COMMIT="${GITHUB_SHA:0:7}"
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          go build \
            -trimpath \
            -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.buildDate=${DATE}" \
            -o "dist/${BINARY}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.suffix }}" \
            "${ENTRYPOINT}"

      - name: Hash
        run: |
          set -e
          cd dist
          sha256sum "${BINARY}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.suffix }}" \
            > "${BINARY}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.suffix }}.sha256"
          ls -la
          du -h "${BINARY}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.suffix }}"

      - name: Size budget guard (non-blocking warning)
        run: |
          f="dist/${BINARY}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.suffix }}"
          mb=$(du -m "$f" | cut -f1)
          echo "binary size: ${mb}MB"
          if [ "$mb" -gt 60 ]; then
            echo "::warning::binary exceeds 60MB budget (${mb}MB). Check for accidental runtime deps (e.g. Python sidecar, unstripped panel assets)."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          retention-days: 14

  # ---------------------------------------------------------------- image -----
  image:
    name: docker / multi-arch build
    runs-on: ubuntu-24.04
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          load: false
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=ci
          cache-to: type=gha,scope=ci,mode=max
          tags: all2api:ci

  # ---------------------------------------------------------------- smoke -----
  smoke:
    name: smoke / healthz
    runs-on: ubuntu-24.04
    # `panel` is only an ordering dependency here: it decides whether the panel seam
    # assertion below runs at all. Job NAME and key are unchanged, so the future
    # branch-protection required list is unaffected.
    needs: [image, panel]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build amd64 image for local run
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: all2api:smoke

      - name: Create minimal runtime config
        run: |
          set -e
          mkdir -p auths data
          cat > config.json <<'EOF'
          {
            "listen": ":7863",
            "api_key": "",
            "auth_dir": "./auths",
            "state_file": "./data/state.json"
          }
          EOF

      - name: Start container
        run: |
          set -e
          docker run -d --name smoke \
            -p 7863:7863 \
            -v "$PWD/config.json:/app/config.json:ro" \
            -v "$PWD/auths:/app/auths" \
            -v "$PWD/data:/app/data" \
            -e TZ=Asia/Shanghai \
            all2api:smoke
          echo "container started; polling ${HEALTH_PATH}"

      - name: Wait for healthy
        run: |
          set -e
          ok=0
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' smoke 2>/dev/null || echo unknown)
            http=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${LISTEN_PORT}${HEALTH_PATH}" || echo 000)
            echo "attempt $i: health=$status http=$http"
            if [ "$status" = "healthy" ] && [ "$http" = "200" ]; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            echo "--- container logs ---"
            docker logs smoke || true
            echo "::error::/healthz never became healthy — M0 acceptance criterion not met"
            exit 1
          fi

      - name: Assert healthz payload identifies the service
        run: |
          set -e
          body=$(curl -fsS "http://127.0.0.1:${LISTEN_PORT}${HEALTH_PATH}")
          echo "$body"
          echo "$body" | grep -q '"service"' || {
            echo "::error::healthz must include a \"service\" identity field for LB/host probing"
            exit 1
          }

      # B1 seam, end-to-end: the image is built from this repo, its `web` stage runs the real
      # vite build into internal/web/dist, `go build` embeds that directory, and the gateway
      # serves it. So a GET / against the running container is the only check that proves the
      # whole chain — a panel job green + a docker job green proves nothing by themselves.
      # A placeholder page cannot reference a content-hashed bundle, which is exactly what
      # this asserts (positive form, so it does not couple to any specific copy text).
      # Gated on the panel job having produced real output, so it is inert until B1 lands and
      # strictly blocking afterwards: one variable at a time.
      - name: Assert served panel is the built bundle
        if: needs.panel.outputs.dist == 'true'
        run: |
          set -e
          html=$(curl -fsS "http://127.0.0.1:${LISTEN_PORT}/")
          echo "${html}" | head -30
          echo "${html}" | grep -Eq '/assets/[A-Za-z0-9._-]+\.js' || {
            echo "::error::GET / did not reference a built asset bundle — the embedded panel is the placeholder, not B1's build output"
            exit 1
          }
          css=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${LISTEN_PORT}/$(echo "${html}" | grep -Eo '/assets/[A-Za-z0-9._-]+\.css' | head -1)")
          echo "asset css probe: http=${css}"
          test "${css}" = "200" || {
            echo "::error::index.html references an /assets/*.css that the server does not serve"
            exit 1
          }
          echo "panel seam verified: built bundle served from go:embed inside the production image"

      - name: Assert graceful shutdown within stop grace period
        run: |
          set -e
          start=$(date +%s)
          docker stop --time 10 smoke
          end=$(date +%s)
          elapsed=$((end-start))
          echo "graceful shutdown completed in ${elapsed}s"
          if [ "$elapsed" -gt 10 ]; then
            echo "::error::shutdown exceeded the 10s stop grace window — SIGTERM handling is not correct"
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: docker rm -f smoke || true

  # ------------------------------------------------------------ security ------
  security:
    name: security / scans
    runs-on: ubuntu-24.04
    needs: [test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Every scan runs with continue-on-error and reports through ONE aggregate
      # gate step. Reason (measured on run 38494575451): the first gosec step failed
      # and GitHub marked the following "Dependency vulnerability scan (OSV)" step as
      # skipped, so a single scan failure destroyed the evidence for the other two.
      # Scans must produce findings independently, then the job decides.
      - name: Secret scan (gitleaks)
        id: gitleaks
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # The repo has no go.sum yet (the module declares zero requires), and setup-go's
          # default dependency pattern is **/go.sum — with no such file the module-cache key
          # silently misses on every run ("Restore cache failed: Dependencies file is not
          # found", measured on run 38499871123). go.mod is the honest lock input today.
          # When M2 adds a dependency this must move to go.sum in the same commit, together
          # with `go mod verify` and `-mod=readonly`.
          cache-dependency-path: go.mod

      - name: Scan toolchain self-report
        run: |
          set -e
          go version
          echo "GOTOOLCHAIN=$(go env GOTOOLCHAIN)  pinned GO_VERSION=${{ env.GO_VERSION }}"
          echo "pins: gosec=${{ env.GOSEC_VERSION }} govulncheck=${{ env.GOVULNCHECK_VERSION }} golangci=${{ env.GOLANGCI_VERSION }}"

      # Built from source at the pinned version, on THIS job's Go — no prebuilt release
      # artifact, no container image whose toolchain we cannot see. gosec's package loader
      # cannot read export data newer than its own build, and when it fails it still prints
      # `Issues : 0`: a silent false green (measured: 63 failed loads under go1.27). Source
      # install makes "analyser Go >= module Go" a property we control instead of a hope.
      #
      # Pinned, not @master: @master silently changes the rule set and the CLI surface under
      # us (that is how the removed `-exit-code` flag reached us). `-exit-code 1` is still
      # WRONG on current gosec — the flag no longer exists and the binary aborts during
      # argument parsing without analysing a single file. gosec already exits non-zero when
      # it reports issues at or above `-severity`, which is the behaviour we want here.
      #
      # HIGH stays the blocking threshold on purpose: same bar as before, only now it is
      # actually evaluated. Lower severities are reported but are not gates — they belong in
      # review, not CI.
      - name: gosec
        id: gosec
        continue-on-error: true
        run: |
          set -e
          go install github.com/securego/gosec/v2/cmd/gosec@${{ env.GOSEC_VERSION }}
          GOSEC="$(go env GOPATH)/bin/gosec"
          # gosec's --version is stamped only in its release pipeline, so a source install
          # prints "Version: dev" and proves nothing about which commit scanned this repo.
          # The module version embedded by `go install pkg@version` does, so that is what we
          # assert. A silent pin miss here is the same failure class as the go1.27 false green.
          "$GOSEC" --version || true
          got=$(go version -m "$GOSEC" | awk '$1=="mod"{print $3}')
          echo "gosec embedded module version: ${got:-none} (pinned ${{ env.GOSEC_VERSION }})"
          if [ "${got}" != "${{ env.GOSEC_VERSION }}" ]; then
            echo "::error::gosec on PATH is ${got:-unknown}, expected ${{ env.GOSEC_VERSION }}"
            exit 1
          fi
          "$GOSEC" -severity high -fmt=text ./...

      # Pinned, not @latest: the tool's own go.mod requires a Go >= its declared minimum, so
      # @latest under GOTOOLCHAIN=local is either an install failure or, under auto, a scan
      # executed by a toolchain nobody declared. Raise together with GO_VERSION.
      - name: Dependency vulnerability scan (OSV)
        id: osv
        continue-on-error: true
        run: |
          set -e
          go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
          GVC="$(go env GOPATH)/bin/govulncheck"
          "$GVC" -version
          got=$(go version -m "$GVC" | awk '$1=="mod"{print $3}')
          echo "govulncheck embedded module version: ${got:-none} (pinned ${{ env.GOVULNCHECK_VERSION }})"
          if [ "${got}" != "${{ env.GOVULNCHECK_VERSION }}" ]; then
            echo "::error::govulncheck on PATH is ${got:-unknown}, expected ${{ env.GOVULNCHECK_VERSION }}"
            exit 1
          fi
          "$GVC" ./...

      # Fails the job if ANY scan failed, and names them so the red is attributable
      # to a specific line (secret / static / dependency) at a glance.
      - name: Aggregate scan verdict
        if: always()
        run: |
          set -e
          failed=""
          for s in gitleaks gosec osv; do
            case "$s" in
              gitleaks) r="${{ steps.gitleaks.outcome }}" ;;
              gosec)    r="${{ steps.gosec.outcome }}" ;;
              osv)      r="${{ steps.osv.outcome }}" ;;
            esac
            echo "scan $s => $r"
            [ "$r" = "failure" ] && failed="$failed $s"
          done
          if [ -n "$failed" ]; then
            echo "::error::security scan(s) failed:${failed}"
            exit 1
          fi
          echo "all security scans passed"
